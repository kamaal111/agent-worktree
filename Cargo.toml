[package]
name = "agent-worktree"
version = "0.1.0"
edition = "2021"
description = "Run coding agents in isolated Git worktrees and development containers."
license = "MIT"

[[bin]]
name = "agent-worktree"
path = "src/bin/agent_worktree.rs"

[[bin]]
name = "codex-worktree"
path = "src/bin/codex_worktree.rs"

[[bin]]
name = "claude-worktree"
path = "src/bin/claude_worktree.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
